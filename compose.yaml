# Laravel 開発環境（Gold LINK DX）
# 使い方は README.md を参照。普段は .\dev.ps1 up / down で操作する。
#
#   sync       … src フォルダと、コンテナ内の速い領域（app）を双方向にそろえる
#   web        … nginx（Laravel の入口）                     http://localhost:8280
#   php        … PHP-FPM（Laravel 本体。artisan・composer もここで実行）
#   vite       … 画面の CSS・JS を作る開発サーバー（保存ですぐ反映） http://localhost:5174
#   db         … MySQL 8.4（開発用 app・テスト用 app_test）   localhost:3307
#   phpmyadmin … DB を画面で見る                             http://localhost:8281
#   mailpit    … 送信メールを受け止めて表示する               http://localhost:8030
#
# ポートはすべて 127.0.0.1 に限定（同じネットワークの他の PC からは見えない）
# ここの environment は、Laravel の .env より優先される（DB やメールの接続先を Docker 用にそろえるため）

name: gldx-laravel

services:
  # Windows のフォルダをコンテナから直接読むと遅い（ファイル1つに数ミリ秒）。
  # Laravel には速い領域（app ボリューム）を読ませ、src フォルダとは 2 秒おきに双方向でそろえる。
  # vendor・node_modules は同期しない（コンテナ側だけに置く）。詳しくは docker/sync/sync-app.sh
  sync:
    build:
      context: ./docker/sync
    volumes:
      - ./src:/host
      - app:/app
      - sync-state:/state
    healthcheck:
      test: ["CMD", "test", "-f", "/state/ready"]
      interval: 2s
      timeout: 2s
      retries: 60

  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    # 開発用：root で動かす（理由は docker/php/fpm-env.conf）
    command: ["php-fpm", "-R"]
    volumes:
      - app:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8280}
      APP_LOCALE: ja
      APP_FAKER_LOCALE: ja_JP
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: noreply@example.com
      MAIL_FROM_NAME: お問い合わせ窓口（見本）
      # お問い合わせの通知を受け取るアドレス（開発中は Mailpit に届く）
      CONTACT_NOTIFY_TO: owner@example.com
      # Xdebug は普段オフ。.\dev.ps1 xdebug on で debug に切り替える
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    depends_on:
      db:
        condition: service_healthy
      sync:
        condition: service_healthy

  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8280}:80"
    volumes:
      - app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  vite:
    image: node:${NODE_VERSION:-24}-bookworm-slim
    working_dir: /var/www/html
    command: ["sh", "-c", "npm install --no-fund && npm run dev"]
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - app:/var/www/html
    environment:
      APP_URL: http://localhost:${APP_PORT:-8280}
      TZ: Asia/Tokyo
    depends_on:
      sync:
        condition: service_healthy

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
      TZ: Asia/Tokyo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "127.0.0.1:${PMA_PORT:-8281}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8030}:8025"

volumes:
  app:
  sync-state:
  db-data:
